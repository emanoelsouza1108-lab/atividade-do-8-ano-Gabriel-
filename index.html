<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atividade do 8º Ano</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#1d4ed8,#0f172a);
  color:#fff
}
.wrap{max-width:850px;margin:auto;padding:20px}
.card{
  background:rgba(255,255,255,.95);color:#172033;border-radius:22px;
  padding:24px;box-shadow:0 12px 35px #0006;margin:18px 0
}
h1{margin-top:0;color:#173b8f}
.intro{line-height:1.65}
.q{font-size:20px;font-weight:700;margin:0 0 18px}
.opt{
  display:block;width:100%;margin:10px 0;padding:14px;
  border:2px solid #cbd5e1;border-radius:14px;background:#fff;
  text-align:left;font-size:16px;cursor:pointer
}
.opt:hover{background:#eff6ff}
.opt.sel{border-color:#2563eb;background:#dbeafe}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{background:#dbeafe;color:#1e40af;border-radius:999px;padding:8px 12px;font-weight:700}
.next,.restart{
  border:0;border-radius:14px;padding:14px 20px;font-size:16px;
  font-weight:700;background:#2563eb;color:#fff;cursor:pointer
}
.next:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none}
.score{font-size:30px;font-weight:800;color:#173b8f}
.small{color:#475569}
hr{border:0;border-top:1px solid #cbd5e1;margin:22px 0}
</style>
</head>
<body>
<div class="wrap">

<section id="start" class="card">
<h1>📚 Atividade do 8º Ano</h1>
<p>40 questões: 20 de Português e 20 de Matemática.</p>
<p class="small">
Escolha uma alternativa. Você não verá se acertou ou errou durante a atividade.
A pontuação aparece somente no final.
</p>
<button class="next" onclick="begin()">🚀 Entrar na atividade</button>
</section>

<section id="quiz" class="card hidden">
<div class="top">
<span class="pill" id="part"></span>
<span class="pill" id="count"></span>
</div>
<div id="questionBox"></div>
<div style="display:flex;gap:10px;margin-top:12px"><button class="next" id="back" onclick="goBack()" disabled style="flex:1">⬅️ Voltar</button><button class="next" id="next" disabled onclick="goNext()" style="flex:2">Próxima questão</button></div>
</section>

<section id="result" class="card hidden"></section>

</div>

<script>
const textBase = `Em uma escola, um grupo de estudantes decidiu transformar uma sala pouco utilizada em um espaço de estudos. Eles organizaram os livros por assunto, criaram um mural com metas semanais e combinaram horários para estudar em silêncio. No começo, alguns alunos acharam difícil manter a rotina. Com o passar das semanas, perceberam que pequenas atitudes faziam diferença: separar o material antes de começar, dividir tarefas maiores em etapas e reservar alguns minutos para revisar o que havia sido aprendido.

A turma também descobriu que estudar não significa apenas memorizar informações. Fazer perguntas, comparar ideias, explicar um conteúdo com as próprias palavras e corrigir os próprios erros ajudam a construir uma aprendizagem mais sólida. Assim, o espaço de estudos passou a ser usado não apenas antes das provas, mas durante todo o processo de aprendizagem.`;

const qs = [
["Português","O texto afirma que:",["A organização e a revisão podem contribuir para uma aprendizagem mais sólida.","Estudar serve apenas para memorizar.","A rotina de estudos não precisa ser mantida.","Revisar atrapalha a aprendizagem."],0],
["Português","No trecho “manter a rotina de estudos”, a expressão destacada indica:",["organizar livros.","fazer perguntas.","continuar seguindo um hábito de estudo.","mudar de escola."],2],
["Português","A palavra “tempo”, no contexto do texto, é um substantivo que indica:",["tempo.","lugar.","modo.","causa."],0],
["Português","Em “pequenas atitudes faziam diferença”, “atitudes” significa:",["ações ou comportamentos.","lugares.","horários.","livros."],0],
["Português","Segundo o texto, ajudam a construir uma aprendizagem mais sólida:",["apenas decorar informações.","somente estudar antes das provas.","comparar ideias e explicar conteúdos.","evitar corrigir erros."],2],
["Português","Uma palavra que poderia substituir “No começo” mantendo ideia de contraste seria:",["portanto","entretanto","porque","assim"],1],
["Português","Em “um grupo de estudantes decidiu”, o sujeito é:",["a sala.","os livros.","o grupo de estudantes.","a aprendizagem."],2],
["Português","A finalidade principal do texto é:",["informar e refletir sobre hábitos de estudo.","contar uma aventura.","ensinar uma receita.","descrever uma competição."],0],
["Português","Qual frase está de acordo com o texto?",["Os alunos abandonaram a rotina.","Melhoraram porque revisaram o conteúdo.","Eles deixaram de fazer perguntas.","A sala deixou de ser usada."],1],
["Português","Em “reservar alguns minutos”, “minutos” indica:",["tempo.","lugar.","modo.","causa."],0],
["Português","Em “A turma também descobriu”, o sujeito é:",["a escola.","a turma.","os livros.","as provas."],1],
["Português","Uma palavra com sentido próximo de “sólida”, no contexto, é:",["frágil.","consistente.","rápida.","pequena."],1],
["Português","Qual alternativa apresenta uma ação realizada pelos estudantes?",["Os estudantes organizaram o material.","A escola fechou.","As provas desapareceram.","Os livros foram queimados."],0],
["Português","A palavra “simples”, se usada para caracterizar “atitudes”, é um:",["verbo.","substantivo.","adjetivo.","pronome."],2],
["Português","“Estudar” é uma forma verbal no:",["infinitivo.","pretérito.","futuro do presente.","gerúndio."],0],
["Português","A expressão “faziam diferença”, usada no texto, apresenta:",["linguagem figurada.","linguagem científica.","erro de concordância.","uma pergunta."],0],
["Português","Em “não apenas antes das provas, mas durante todo o processo”, “mas” indica:",["adição/contraste de ideias.","tempo.","causa.","finalidade."],0],
["Português","Na expressão “durante todo o processo”, “durante” indica:",["tempo.","lugar.","posse.","dúvida."],0],
["Português","Qual frase resume uma ideia central do texto?",["A revisão fazia parte do processo de aprendizagem.","Os estudantes não precisavam estudar.","A sala era usada somente para provas.","Memorizar era a única forma de aprender."],0],
["Português","Qual título combina melhor com o texto?",["Uma rotina que ajuda a aprender","A escola sem livros","Uma competição de matemática","O fim dos estudos"],0],

["Matemática","25 + 0 =",["20","25","30","15"],1],
["Matemática","36 ÷ 6 =",["5","7","6","8"],2],
["Matemática","Qual fração é equivalente a 3/4?",["6/8","5/8","4/6","3/8"],0],
["Matemática","Uma mochila custa R$80 e recebeu desconto de R$20. Qual o novo preço?",["R$40","R$60","R$70","R$100"],1],
["Matemática","Qual é a raiz quadrada de 144?",["10","11","12","14"],2],
["Matemática","Se x + 7 = 20, então x =",["11","12","13","14"],2],
["Matemática","A área de um retângulo de 8 cm por 5 cm é:",["13 cm²","26 cm²","40 cm²","80 cm²"],2],
["Matemática","O perímetro de um retângulo de lados 6 cm e 8 cm é:",["14 cm","24 cm","28 cm","48 cm"],2],
["Matemática","Qual fração representa 5 partes de um total de 6?",["1/6","5/6","6/5","5/11"],1],
["Matemática","Resolva: x + 2 = 0.",["−2","0","2","4"],0],
["Matemática","Quanto é 3 × 5?",["8","10","15","20"],2],
["Matemática","Quanto é 64 ÷ 8?",["6","8","10","12"],1],
["Matemática","Quanto é 45 − 15?",["20","25","30","35"],2],
["Matemática","A expressão “o dobro de x mais 5” é:",["x+5","2x+5","2(x+5)","x²+5"],1],
["Matemática","Um ângulo suplementar de 130° mede:",["40°","50°","60°","70°"],1],
["Matemática","Quanto é 3 × 4?",["9","10","12","14"],2],
["Matemática","Um produto de R$70 teve desconto de R$21. Qual o preço final?",["R$49","R$50","R$51","R$59"],0],
["Matemática","Quanto é 12 ÷ 4?",["2","3","4","6"],1],
["Matemática","Qual fração representa 3 partes de um total de 8?",["3/5","3/8","5/8","8/3"],1],
["Matemática","Qual é o volume de um cubo com aresta de 3 cm?",["9 cm³","18 cm³","27 cm³","30 cm³"],2]
];

let i=0, score=0, chosen=null;
const answers=[];

function begin(){
  i=0; score=0; chosen=null; answers.length=0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}

function render(){
  chosen = answers[i] ?? null;
  const q=qs[i];
  document.getElementById('part').textContent=q[0];
  document.getElementById('count').textContent=(i+1)+' / 40';

  const box=document.getElementById('questionBox');
  box.innerHTML='';

  if(i===0){
    const p=document.createElement('div');
    p.className='intro';
    p.innerHTML='<h2>Texto-base</h2>'+
      '<p>'+textBase.replace(/\n\n/g,'</p><p>')+'</p><hr>';
    box.appendChild(p);
  }

  const h=document.createElement('p');
  h.className='q';
  h.textContent=q[1];
  box.appendChild(h);

  q[2].forEach((a,n)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=a;
    if(chosen===n) b.classList.add('sel');
    b.onclick=()=>choose(b,n);
    if(chosen!==null) b.disabled=true;
    box.appendChild(b);
  });

  document.getElementById('back').disabled = i===0;
  const next=document.getElementById('next');
  next.disabled=chosen===null;
  next.textContent=i===39?'Ver resultado':'Próxima questão';
}

function choose(btn,n){
  if(chosen!==null)return;
  chosen=n;
  answers[i]=n;
  btn.classList.add('sel');
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  document.getElementById('next').disabled=false;
}

function goNext(){
  if(chosen===null)return;
  i++;
  if(i<qs.length) render();
  else finish();
}

function goBack(){
  if(i===0)return;
  i--;
  render();
}

function finish(){
  document.getElementById('quiz').classList.add('hidden');
  const r=document.getElementById('result');
  r.classList.remove('hidden');

  score=answers.reduce((total,ans,n)=>total+(ans===qs[n][3]?1:0),0);
  const ok=score>=20;
  r.innerHTML=
    '<h1>🏁 Resultado</h1>'+
    '<p class="score">'+score+' / 40 pontos</p>'+
    '<h2>'+(ok?'🎉 Meta atingida!':'📖 Meta não atingida')+'</h2>'+
    '<p>'+(ok
      ?'Você alcançou pelo menos 20 pontos.'
      :'Você ficou abaixo de 20 pontos. Revise o conteúdo e tente novamente.')+
    '</p>'+
    '<button class="restart" onclick="restart()">🔄 Recomeçar</button>';
}

function restart(){
  i=0;
  score=0;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}
</script>
</body>
</html>
