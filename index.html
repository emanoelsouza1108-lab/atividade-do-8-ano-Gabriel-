<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atividade do 8º Ano</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#1d4ed8,#0f172a);
  color:#fff
}
.wrap{max-width:850px;margin:auto;padding:20px}
.card{
  background:rgba(255,255,255,.95);color:#172033;border-radius:22px;
  padding:24px;box-shadow:0 12px 35px #0006;margin:18px 0
}
h1{margin-top:0;color:#173b8f}
.intro{line-height:1.65}
.q{font-size:20px;font-weight:700;margin:0 0 18px}
.opt{
  display:block;width:100%;margin:10px 0;padding:14px;
  border:2px solid #cbd5e1;border-radius:14px;background:#fff;
  text-align:left;font-size:16px;cursor:pointer
}
.opt:hover{background:#eff6ff}
.opt.sel{border-color:#2563eb;background:#dbeafe}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{background:#dbeafe;color:#1e40af;border-radius:999px;padding:8px 12px;font-weight:700}
.next,.restart{
  border:0;border-radius:14px;padding:14px 20px;font-size:16px;
  font-weight:700;background:#2563eb;color:#fff;cursor:pointer
}
.next:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none}
.score{font-size:30px;font-weight:800;color:#173b8f}
.small{color:#475569}
hr{border:0;border-top:1px solid #cbd5e1;margin:22px 0}
</style>
</head>
<body>
<div class="wrap">

<section id="start" class="card">
<h1>📚 Atividade do 8º Ano</h1>
<p>40 questões: 20 de Português e 20 de Matemática.</p>
<p class="small">
Escolha uma alternativa. Você não verá se acertou ou errou durante a atividade.
A pontuação aparece somente no final.
</p>
<button class="next" onclick="begin()">🚀 Entrar na atividade</button>
</section>

<section id="quiz" class="card hidden">
<div class="top">
<span class="pill" id="part"></span>
<span class="pill" id="count"></span>
</div>
<div id="questionBox"></div>
<div style="display:flex;gap:10px;margin-top:12px"><button class="next" id="back" onclick="goBack()" disabled style="flex:1">⬅️ Voltar</button><button class="next" id="next" disabled onclick="goNext()" style="flex:2">Próxima questão</button></div>
</section>

<section id="result" class="card hidden"></section>

</div>

<script>
const textBase = `Em uma escola, um grupo de estudantes decidiu transformar uma sala pouco utilizada em um espaço de estudos. Eles organizaram os livros por assunto, criaram um mural com metas semanais e combinaram horários para estudar em silêncio. No começo, alguns alunos acharam difícil manter a rotina. Com o passar das semanas, perceberam que pequenas atitudes faziam diferença: separar o material antes de começar, dividir tarefas maiores em etapas e reservar alguns minutos para revisar o que havia sido aprendido.

A turma também descobriu que estudar não significa apenas memorizar informações. Fazer perguntas, comparar ideias, explicar um conteúdo com as próprias palavras e corrigir os próprios erros ajudam a construir uma aprendizagem mais sólida. Assim, o espaço de estudos passou a ser usado não apenas antes das provas, mas durante todo o processo de aprendizagem.`;

const qs = [
["Português","1. Considerando o texto inteiro, qual afirmação melhor explica por que a rotina passou a ser importante para a turma?",["Porque os alunos descobriram que pequenas ações repetidas podem melhorar o processo de aprendizagem.","Porque a turma concluiu que estudar em silêncio é suficiente para aprender.","Porque organizar livros substitui a necessidade de revisar conteúdos.","Porque estudar somente antes das provas ficou mais fácil."],0],
["Português","2. No trecho “No começo, alguns alunos acharam difícil manter a rotina”, a palavra “alguns” permite concluir que:",["todos os alunos tiveram a mesma dificuldade.","nenhum aluno teve dificuldade.","apenas uma parte dos alunos teve essa dificuldade.","a dificuldade ocorreu somente depois das primeiras semanas."],2],
["Português","3. A expressão “Com o passar das semanas” contribui para indicar que:",["a mudança aconteceu instantaneamente.","as percepções da turma foram se modificando ao longo do tempo.","os alunos estudaram somente durante algumas semanas.","a rotina foi abandonada depois de uma semana."],1],
["Português","4. Em “pequenas atitudes faziam diferença”, o verbo “faziam” está no plural porque concorda com:",["“diferença”.","“pequenas”.","“atitudes”.","“pequenas atitudes” apenas por causa de “diferença”."],2],
["Português","5. Qual alternativa apresenta uma ação que o texto NÃO associa à aprendizagem mais sólida?",["Fazer perguntas.","Comparar ideias.","Corrigir os próprios erros.","Memorizar informações sem questioná-las."],3],
["Português","6. Em “não apenas antes das provas, mas durante todo o processo”, a construção destacada estabelece principalmente uma relação de:",["restrição seguida de ampliação.","causa seguida de consequência.","tempo seguido de lugar.","oposição entre dois fatos incompatíveis."],0],
["Português","7. Se o trecho “alguns alunos acharam difícil manter a rotina” fosse reescrito como “alguns alunos acharam difícil mantê-la”, o pronome “la” retomaria:",["a sala.","a rotina.","a aprendizagem.","a revisão."],1],
["Português","8. Qual interpretação é mais compatível com a ideia de que estudar “não significa apenas memorizar informações”?",["Memorizar nunca tem qualquer utilidade.","Aprender envolve também compreender, relacionar e revisar ideias.","Só é possível aprender por meio de perguntas.","A memória deve ser substituída pela organização dos livros."],1],
["Português","9. Em “separar o material antes de começar”, a palavra “antes” estabelece uma relação de:",["causa.","condição.","anterioridade temporal.","oposição."],2],
["Português","10. No trecho “explicar um conteúdo com as próprias palavras”, a expressão “com as próprias palavras” indica principalmente:",["o assunto que deve ser explicado.","a maneira como a explicação é feita.","o momento em que a explicação ocorre.","a causa da explicação."],1],
["Português","11. A frase “A turma também descobriu que estudar não significa apenas memorizar informações” sugere que a descoberta da turma foi:",["uma conclusão mais ampla sobre o que significa aprender.","uma mudança apenas na organização dos livros.","uma rejeição completa da memória.","uma regra para estudar somente antes das provas."],0],
["Português","12. No texto, a palavra “sólida”, em “aprendizagem mais sólida”, pode ser entendida como:",["literalmente feita de material duro.","mais consistente e bem construída.","mais rápida e passageira.","mais silenciosa e organizada."],1],
["Português","13. Qual alternativa contém apenas ações mencionadas no texto como parte da rotina de estudo?",["Dividir tarefas, revisar e corrigir os próprios erros.","Competir, decorar e evitar perguntas.","Organizar provas, competir e memorizar.","Silenciar a turma, fazer provas e decorar."],0],
["Português","14. Em “uma sala pouco utilizada”, a palavra “utilizada” caracteriza o substantivo “sala”. Portanto, exerce função de:",["substantivo.","adjetivo.","verbo principal da oração.","pronome."],1],
["Português","15. Em “Eles organizaram os livros por assunto”, o pronome “Eles” retoma:",["os livros.","os horários.","o grupo de estudantes.","os assuntos."],2],
["Português","16. Qual mudança de pontuação manteria a ideia original do trecho sem alterar seu sentido principal?",["Separar por vírgula a expressão “Com o passar das semanas” do restante da oração.","Retirar todas as vírgulas do texto.","Colocar ponto final no meio de cada enumeração.","Substituir os dois-pontos por ponto de interrogação."],0],
["Português","17. Em “dividir tarefas maiores em etapas”, a palavra “maiores” estabelece uma característica em relação a:",["“etapas”.","“tarefas”.","“dividir”.","“em”."],1],
["Português","18. Se “A turma também descobriu” fosse transformado em “As turmas também descobriram”, a mudança principal seria de:",["tempo verbal apenas.","número do sujeito e concordância verbal.","gênero do verbo.","sentido de oposição."],1],
["Português","19. Qual alternativa apresenta uma inferência que o texto permite fazer, embora não diga isso exatamente?",["A turma passou a usar o espaço de estudos de maneira mais contínua.","Todos os alunos tiveram exatamente o mesmo desempenho.","As provas deixaram de existir na escola.","A sala era usada exclusivamente para matemática."],0],
["Português","20. Qual título seria mais específico e, ao mesmo tempo, coerente com todas as ideias do texto?",["Como pequenos hábitos podem fortalecer a aprendizagem","Por que decorar é a única forma de estudar","A sala que substituiu todas as aulas","Uma competição para escolher o melhor aluno"],0],

["Matemática","21. Uma expressão é dada por 3(2x − 5) + 4. Qual forma simplificada é equivalente a ela?",["6x − 1","6x − 11","6x + 1","2x − 1"],0],
["Matemática","22. Se 2x + 7 = 25, qual é o valor de x?",["7","8","9","10"],2],
["Matemática","23. Uma fração equivalente a 18/24, na forma simplificada, é:",["2/3","3/4","4/5","6/8"],1],
["Matemática","24. Um produto de R$ 120 recebeu primeiro 25% de desconto. Qual foi o preço após o desconto?",["R$ 85","R$ 90","R$ 95","R$ 100"],1],
["Matemática","25. Uma pessoa percorreu 3/5 de um trajeto de 20 km. Quantos quilômetros ainda faltam?",["8 km","10 km","12 km","15 km"],0],
["Matemática","26. O valor de x que satisfaz 4x − 9 = 2x + 7 é:",["6","7","8","9"],2],
["Matemática","27. Um retângulo tem área de 96 cm² e comprimento de 12 cm. Qual é sua largura?",["6 cm","7 cm","8 cm","9 cm"],2],
["Matemática","28. Um quadrado tem perímetro de 36 cm. Sua área é:",["36 cm²","72 cm²","81 cm²","144 cm²"],2],
["Matemática","29. Qual número é maior?",["0,58","5/9","0,56","1/2"],1],
["Matemática","30. Uma temperatura era de −3 °C e aumentou 8 °C. A nova temperatura é:",["−11 °C","−5 °C","5 °C","11 °C"],2],
["Matemática","31. Se y = 3x − 2 e x = 5, então y é:",["10","11","13","15"],2],
["Matemática","32. Qual é o resultado de (−3)² − 2³?",["−17","1","17","−1"],1],
["Matemática","33. Uma loja aumenta um preço de R$ 80 em 15%. Qual passa a ser o preço?",["R$ 88","R$ 90","R$ 92","R$ 95"],2],
["Matemática","34. Qual expressão representa corretamente “a metade de x, diminuída de 4”?",["x/2 + 4","(x − 4)/2","x/2 − 4","2x − 4"],2],
["Matemática","35. Dois ângulos são suplementares. Se um mede 3x + 10° e o outro mede 2x − 20°, qual é o valor de x?",["30","35","38","40"],1],
["Matemática","36. Um triângulo tem ângulos de 2x, x + 10° e x + 30°. Qual é o valor de x?",["30°","35°","40°","45°"],1],
["Matemática","37. Uma caixa em forma de paralelepípedo mede 4 cm, 5 cm e 6 cm. Qual é seu volume?",["60 cm³","90 cm³","120 cm³","150 cm³"],2],
["Matemática","38. Uma quantia de R$ 200 foi dividida na razão 3:2 entre duas pessoas. Quanto recebeu a pessoa que ficou com a maior parte?",["R$ 80","R$ 100","R$ 120","R$ 140"],2],
["Matemática","39. Uma prova tem 40 questões. Um aluno acertou 70%. Quantas questões ele acertou?",["24","26","28","30"],2],
["Matemática","40. Um número é multiplicado por 3 e depois diminuído de 7, resultando em 20. Qual é esse número?",["7","8","9","10"],1]
];


let i=0, score=0, chosen=null;
const answers=[];

function begin(){
  i=0; score=0; chosen=null; answers.length=0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}

function render(){
  chosen = answers[i] ?? null;
  const q=qs[i];
  document.getElementById('part').textContent=q[0];
  document.getElementById('count').textContent=(i+1)+' / 40';

  const box=document.getElementById('questionBox');
  box.innerHTML='';

  if(i===0){
    const p=document.createElement('div');
    p.className='intro';
    p.innerHTML='<h2>Texto-base</h2>'+
      '<p>'+textBase.replace(/\n\n/g,'</p><p>')+'</p><hr>';
    box.appendChild(p);
  }

  const h=document.createElement('p');
  h.className='q';
  h.textContent=q[1];
  box.appendChild(h);

  q[2].forEach((a,n)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=a;
    if(chosen===n) b.classList.add('sel');
    b.onclick=()=>choose(b,n);
    if(chosen!==null) b.disabled=true;
    box.appendChild(b);
  });

  document.getElementById('back').disabled = i===0;
  const next=document.getElementById('next');
  next.disabled=chosen===null;
  next.textContent=i===39?'Ver resultado':'Próxima questão';
}

function choose(btn,n){
  if(chosen!==null)return;
  chosen=n;
  answers[i]=n;
  btn.classList.add('sel');
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  document.getElementById('next').disabled=false;
}

function goNext(){
  if(chosen===null)return;
  i++;
  if(i<qs.length) render();
  else finish();
}

function goBack(){
  if(i===0)return;
  i--;
  render();
}

function finish(){
  document.getElementById('quiz').classList.add('hidden');
  const r=document.getElementById('result');
  r.classList.remove('hidden');

  score=answers.reduce((total,ans,n)=>total+(ans===qs[n][3]?1:0),0);
  const ok=score>=20;
  r.innerHTML=
    '<h1>🏁 Resultado</h1>'+
    '<p class="score">'+score+' / 40 pontos</p>'+
    '<h2>'+(ok?'🎉 Meta atingida!':'📖 Meta não atingida')+'</h2>'+
    '<p>'+(ok
      ?'Você alcançou pelo menos 20 pontos.'
      :'Você ficou abaixo de 20 pontos. Revise o conteúdo e tente novamente.')+
    '</p>'+
    '<button class="restart" onclick="restart()">🔄 Recomeçar</button>';
}

function restart(){
  i=0;
  score=0;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}
</script>
</body>
</html>
