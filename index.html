
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade do 8º Ano</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #111827, #1e3a8a);
  color: white;
  min-height: 100vh;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.10);
  border-radius: 20px;
  padding: 25px;
  margin-top: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

h1, h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  cursor: pointer;
}

.start {
  background: #22c55e;
  color: white;
  font-weight: bold;
}

.answer {
  background: white;
  color: #111827;
  text-align: left;
}

.answer.selected {
  background: #f59e0b;
  color: white;
}

.next {
  background: #2563eb;
  color: white;
  font-weight: bold;
}

.texto {
  background: rgba(0,0,0,.25);
  padding: 15px;
  border-radius: 12px;
  line-height: 1.6;
  margin-bottom: 20px;
}

#quiz,
#result {
  display: none;
}

.progress {
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}

.result-score {
  font-size: 42px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="start">
    <h1>📚 Atividade do 8º Ano</h1>
    <p style="text-align:center;">
      40 questões — Português e Matemática
    </p>
    <button class="start" onclick="startQuiz()">
      🚀 Entrar na atividade
    </button>
  </div>

  <div class="card" id="quiz">
    <div class="progress" id="progress"></div>
    <h2 id="question"></h2>
    <div id="texto"></div>
    <div id="answers"></div>
    <button class="next" id="next" onclick="nextQuestion()" disabled>
      Próxima questão ➡️
    </button>
  </div>

  <div class="card" id="result">
    <h1>🏁 Resultado</h1>
    <div class="result-score" id="score"></div>
    <h2 id="message"></h2>
    <button class="start" onclick="restartQuiz()">
      🔄 Recomeçar
    </button>
  </div>

</div>
