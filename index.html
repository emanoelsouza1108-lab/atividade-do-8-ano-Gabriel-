<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atividade do 8º Ano</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#1d4ed8,#0f172a);
  color:#fff
}
.wrap{max-width:850px;margin:auto;padding:20px}
.card{
  background:rgba(255,255,255,.95);color:#172033;border-radius:22px;
  padding:24px;box-shadow:0 12px 35px #0006;margin:18px 0
}
h1{margin-top:0;color:#173b8f}
.intro{line-height:1.65}
.q{font-size:20px;font-weight:700;margin:0 0 18px}
.opt{
  display:block;width:100%;margin:10px 0;padding:14px;
  border:2px solid #cbd5e1;border-radius:14px;background:#fff;
  text-align:left;font-size:16px;cursor:pointer
}
.opt:hover{background:#eff6ff}
.opt.sel{border-color:#2563eb;background:#dbeafe}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{background:#dbeafe;color:#1e40af;border-radius:999px;padding:8px 12px;font-weight:700}
.next,.restart{
  border:0;border-radius:14px;padding:14px 20px;font-size:16px;
  font-weight:700;background:#2563eb;color:#fff;cursor:pointer
}
.next:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none}
.score{font-size:30px;font-weight:800;color:#173b8f}
.small{color:#475569}
hr{border:0;border-top:1px solid #cbd5e1;margin:22px 0}
</style>
</head>
<body>
<div class="wrap">

<section id="start" class="card">
<h1>📚 Atividade do 8º Ano</h1>
<p>40 questões: 20 de Português e 20 de Matemática.</p>
<p class="small">
Escolha uma alternativa. Você não verá se acertou ou errou durante a atividade.
A pontuação aparece somente no final.
</p>
<button class="next" onclick="begin()">🚀 Entrar na atividade</button>
</section>

<section id="quiz" class="card hidden">
<div class="top">
<span class="pill" id="part"></span>
<span class="pill" id="count"></span>
</div>
<div id="questionBox"></div>
<div style="display:flex;gap:10px;margin-top:12px"><button class="next" id="back" onclick="goBack()" disabled style="flex:1">⬅️ Voltar</button><button class="next" id="next" disabled onclick="goNext()" style="flex:2">Próxima questão</button></div>
</section>

<section id="result" class="card hidden"></section>

</div>

<script>
const textBase = `Em uma escola, um grupo de estudantes decidiu transformar uma sala pouco utilizada em um espaço de estudos. Eles organizaram os livros por assunto, criaram um mural com metas semanais e combinaram horários para estudar em silêncio. No começo, alguns alunos acharam difícil manter a rotina. Com o passar das semanas, perceberam que pequenas atitudes faziam diferença: separar o material antes de começar, dividir tarefas maiores em etapas e reservar alguns minutos para revisar o que havia sido aprendido.

A turma também descobriu que estudar não significa apenas memorizar informações. Fazer perguntas, comparar ideias, explicar um conteúdo com as próprias palavras e corrigir os próprios erros ajudam a construir uma aprendizagem mais sólida. Assim, o espaço de estudos passou a ser usado não apenas antes das provas, mas durante todo o processo de aprendizagem.`;

const qs = [
["Português","1. A ideia central do texto permite concluir que a organização dos estudos é apresentada como:",["um fator que, sozinho, garante uma aprendizagem mais eficiente.","um recurso que, associado à revisão e à participação ativa, pode favorecer a aprendizagem.","um método que torna desnecessária a compreensão dos conteúdos.","uma estratégia que funciona principalmente para quem tem dificuldade de memorizar."],1],
["Português","2. Ao afirmar que “pequenas atitudes faziam diferença”, o texto sugere que:",["ações simples podem contribuir significativamente quando fazem parte de uma rotina.","ações simples sempre produzem resultados maiores que ações complexas.","apenas mudanças pequenas devem ser feitas durante os estudos.","a diferença na aprendizagem depende exclusivamente da organização do material."],0],
["Português","3. A expressão “No começo” é importante porque:",["indica a causa das dificuldades encontradas pelos alunos.","localiza temporalmente a fase em que a rotina ainda estava sendo construída.","estabelece uma oposição entre os livros e os estudantes.","indica a finalidade da criação do espaço de estudos."],1],
["Português","4. Em “Com o passar das semanas, perceberam...”, o sujeito de “perceberam” é:",["as semanas, porque são o elemento mencionado imediatamente antes.","a rotina de estudos, porque é o assunto principal do período.","os estudantes, recuperados pelo contexto anterior.","as metas semanais, porque foram mencionadas no primeiro parágrafo."],2],
["Português","5. A transformação apresentada no texto ocorre principalmente entre:",["a dificuldade inicial de manter uma rotina e uma compreensão mais ampla sobre como aprender.","a tentativa de memorizar conteúdos e a decisão de abandonar as provas.","a organização dos livros e a substituição do estudo individual pelo coletivo.","o uso da sala antes das provas e a decisão de nunca mais utilizá-la nesse período."],0],
["Português","6. Em “estudar não significa apenas memorizar informações”, “apenas” indica que:",["memorizar informações é desnecessário em qualquer processo de aprendizagem.","memorizar é a única atividade realmente associada ao estudo.","a memorização pode fazer parte do estudo, mas não representa todo o processo.","a memorização deve ser feita somente antes das provas."],2],
["Português","7. Em “Fazer perguntas, comparar ideias, explicar um conteúdo... ajudam”, o plural de “ajudam” ocorre porque:",["o verbo concorda com o conjunto de ações que funciona como sujeito.","o verbo concorda somente com “ideias”, que está no plural.","o verbo concorda com “conteúdo”, entendido como sujeito coletivo.","o plural é exigido pela presença da palavra “próprias”."],0],
["Português","8. Se “durante todo o processo de aprendizagem” fosse trocado por “somente na véspera das provas”, a principal alteração seria:",["o período de utilização do espaço, que passaria de amplo a restrito.","o sujeito da oração, que deixaria de ser “a turma”.","a finalidade do estudo, que passaria a ser exclusivamente memorizar.","a relação de causa, que seria transformada em relação de oposição."],0],
["Português","9. Qual conclusão pode ser inferida do texto sem estar escrita exatamente dessa forma?",["Todos os alunos tiveram o mesmo ritmo de adaptação à rotina.","A sala passou a integrar a rotina de aprendizagem, e não apenas os momentos anteriores às provas.","A organização dos livros foi considerada mais importante que a revisão.","A turma deixou de enfrentar dificuldades depois de criar o mural."],1],
["Português","10. No último parágrafo, “Assim” introduz uma ideia de:",["consequência decorrente das descobertas e mudanças apresentadas anteriormente.","oposição entre a organização inicial e a revisão dos conteúdos.","explicação para a dificuldade que os alunos tiveram no começo.","condição para que a sala pudesse ser usada antes das provas."],0],
["Português","11. Em “separar o material antes de começar”, “antes de começar” indica:",["a condição necessária para separar o material.","o momento anterior ao início da atividade.","a finalidade de separar o material.","a causa pela qual a atividade começa."],1],
["Português","12. Em “reservar alguns minutos para revisar”, “para revisar” expressa:",["o motivo pelo qual os minutos já foram utilizados.","a finalidade de reservar os minutos.","o momento exato em que a revisão termina.","uma oposição entre reservar e revisar."],1],
["Português","13. A frase que mantém mais precisamente o sentido de “estudar não significa apenas memorizar informações” é:",["Estudar é, principalmente, memorizar informações.","Estudar envolve memorizar informações, mas não se limita a isso.","Estudar exige evitar a memorização sempre que possível.","Estudar e memorizar informações são atividades necessariamente diferentes."],1],
["Português","14. Em “uma sala pouco utilizada”, “utilizada” funciona como:",["verbo principal de uma oração independente.","palavra que caracteriza a sala, com valor de adjetivo.","substantivo que nomeia uma característica da sala.","advérbio que modifica diretamente o verbo “utilizar”."],1],
["Português","15. Em “os próprios erros”, o emprego de “próprios” reforça a ideia de que:",["os erros pertencem aos próprios estudantes que estão aprendendo.","os erros são considerados mais importantes que os acertos.","os estudantes cometeram exatamente os mesmos erros.","os erros ocorreram somente durante atividades individuais."],0],
["Português","16. Em “dividir tarefas maiores em etapas”, “maiores” caracteriza:",["as etapas, indicando que elas são mais extensas.","as tarefas, indicando que elas apresentam maior dimensão ou complexidade.","o ato de dividir, indicando intensidade.","o processo de estudo, que não aparece explicitamente na expressão."],1],
["Português","17. A construção “não apenas antes das provas, mas durante todo o processo” principalmente:",["restringe a utilização do espaço aos períodos de avaliação.","amplia o período de utilização do espaço para além das provas.","contrapõe duas formas de memorização usadas pelos estudantes.","mostra que as provas deixaram de fazer parte da rotina."],1],
["Português","18. Ao trocar “a turma também descobriu” por “a turma também havia descoberto”, altera-se principalmente:",["o tempo verbal, mantendo-se essencialmente o sujeito e o sentido.","o sujeito, que passa a ser uma expressão composta.","a voz verbal, que passa de ativa para passiva.","o modo verbal, que passa do indicativo para o subjuntivo."],0],
["Português","19. Qual alternativa contradiz diretamente uma informação do texto?",["A revisão é apresentada como parte do processo de aprendizagem.","Explicar conteúdos com as próprias palavras aparece como uma prática útil.","A turma percebe que aprender envolve atividades além da memorização.","O espaço de estudos é apresentado como um local destinado somente à preparação para provas."],3],
["Português","20. Qual título preserva melhor a ideia central sem acrescentar uma promessa que o texto não faz?",["O método definitivo para nunca errar nas provas","Pequenas práticas e uma aprendizagem mais consistente","Como transformar qualquer aluno em um excelente estudante","A rotina perfeita para garantir notas altas"],1],

["Matemática","21. Se 3(2x − 4) − 2(x + 5) = 18, então x é:",["6","7","8","9"],1],
["Matemática","22. Um número aumentado em 20% passa a ser 72. O número original era:",["58","60","62","64"],1],
["Matemática","23. Qual fração é equivalente a 5/6 − 1/4?",["7/12","8/12","9/12","10/12"],0],
["Matemática","24. Um produto de R$ 200 recebe 15% de desconto e, depois, mais 10% sobre o preço já descontado. O preço final é:",["R$ 150","R$ 153","R$ 155","R$ 160"],1],
["Matemática","25. Em uma turma de 32 alunos, 3/8 faltaram. Quantos compareceram?",["20","21","24","26"],2],
["Matemática","26. Resolva 5x − 2 = 3x + 14.",["7","8","9","10"],1],
["Matemática","27. Um retângulo tem perímetro 50 cm e comprimento 3 cm maior que a largura. Sua área é:",["144 cm²","150 cm²","154 cm²","160 cm²"],2],
["Matemática","28. Um quadrado possui área de 196 cm². Se o lado aumentar 2 cm, a nova área será:",["216 cm²","224 cm²","225 cm²","228 cm²"],2],
["Matemática","29. Qual número é o maior?",["0,605","0,61","3/5","61/100"],1],
["Matemática","30. Um saldo de −R$ 35 recebe um depósito de R$ 80 e depois uma retirada de R$ 27. O saldo final é:",["R$ 17","R$ 18","R$ 28","R$ 38"],2],
["Matemática","31. Se f(x) = 2x² − 3, então f(−2) é:",["5","7","8","11"],3],
["Matemática","32. O resultado de (−2)³ + 5² − 6 é:",["1","3","5","11"],1],
["Matemática","33. Um preço de R$ 240 aumenta 12,5%. O novo preço é:",["R$ 265","R$ 268","R$ 270","R$ 272"],2],
["Matemática","34. “A metade da diferença entre x e 6” corresponde a:",["(x − 6)/2","x/2 − 6","(x + 6)/2","x − 3"],0],
["Matemática","35. Dois ângulos são suplementares. Um mede 4x + 10° e o outro 2x − 10°. O valor de x é:",["25","30","35","40"],1],
["Matemática","36. Em um triângulo, os ângulos medem x, 2x + 10° e 3x − 10°. O maior ângulo mede:",["80°","85°","90°","95°"],2],
["Matemática","37. Um cubo tem volume de 343 cm³. Sua aresta mede:",["6 cm","7 cm","8 cm","9 cm"],1],
["Matemática","38. R$ 360 são divididos na razão 2:3:4. A maior parte corresponde a:",["R$ 140","R$ 150","R$ 160","R$ 180"],2],
["Matemática","39. Um aluno acertou 72% de uma prova com 50 questões. Quantas questões ele errou?",["12","13","14","15"],2],
["Matemática","40. Um número multiplicado por 4 e diminuído de 9 resulta no dobro desse número mais 7. O número é:",["7","8","9","10"],2]
];


let i=0, score=0, chosen=null;
const answers=[];

function begin(){
  i=0; score=0; chosen=null; answers.length=0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}

function render(){
  chosen = answers[i] ?? null;
  const q=qs[i];
  document.getElementById('part').textContent=q[0];
  document.getElementById('count').textContent=(i+1)+' / 40';

  const box=document.getElementById('questionBox');
  box.innerHTML='';

  if(i===0){
    const p=document.createElement('div');
    p.className='intro';
    p.innerHTML='<h2>Texto-base</h2>'+
      '<p>'+textBase.replace(/\n\n/g,'</p><p>')+'</p><hr>';
    box.appendChild(p);
  }

  const h=document.createElement('p');
  h.className='q';
  h.textContent=q[1];
  box.appendChild(h);

  q[2].forEach((a,n)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=a;
    if(chosen===n) b.classList.add('sel');
    b.onclick=()=>choose(b,n);
    if(chosen!==null) b.disabled=true;
    box.appendChild(b);
  });

  document.getElementById('back').disabled = i===0;
  const next=document.getElementById('next');
  next.disabled=chosen===null;
  next.textContent=i===39?'Ver resultado':'Próxima questão';
}

function choose(btn,n){
  if(chosen!==null)return;
  chosen=n;
  answers[i]=n;
  btn.classList.add('sel');
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  document.getElementById('next').disabled=false;
}

function goNext(){
  if(chosen===null)return;
  i++;
  if(i<qs.length) render();
  else finish();
}

function goBack(){
  if(i===0)return;
  i--;
  render();
}

function finish(){
  document.getElementById('quiz').classList.add('hidden');
  const r=document.getElementById('result');
  r.classList.remove('hidden');

  score=answers.reduce((total,ans,n)=>total+(ans===qs[n][3]?1:0),0);
  const ok=score>=20;
  r.innerHTML=
    '<h1>🏁 Resultado</h1>'+
    '<p class="score">'+score+' / 40 pontos</p>'+
    '<h2>'+(ok?'🎉 Meta atingida!':'📖 Meta não atingida')+'</h2>'+
    '<p>'+(ok
      ?'Você alcançou pelo menos 20 pontos.'
      :'Você ficou abaixo de 20 pontos. Revise o conteúdo e tente novamente.')+
    '</p>'+
    '<button class="restart" onclick="restart()">🔄 Recomeçar</button>';
}

function restart(){
  i=0;
  score=0;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}
</script>

<script>
(function () {
  let confirmed = false;

  function getOptionElements() {
    return Array.from(document.querySelectorAll(
      '.option, .answer, .choice, .option-btn, button[data-option], input[type="radio"]'
    ));
  }

  // Selection is reversible until confirmation.
  document.addEventListener('click', function (e) {
    const el = e.target.closest('.option, .answer, .choice, .option-btn, button[data-option]');
    if (!el || confirmed) return;

    const group = el.parentElement;
    const siblings = group ? Array.from(group.children) : [];
    siblings.forEach(x => x.classList && x.classList.remove('selected'));
    el.classList.add('selected');

    window.selectedAnswer = el.dataset.option ?? el.dataset.index ?? el.textContent.trim();
    const fb = document.getElementById('answer-feedback');
    if (fb) {
      fb.textContent = 'Resposta selecionada. Você pode trocar antes de confirmar.';
      fb.style.color = '';
    }
  });

  window.confirmAnswer = function () {
    if (confirmed) return;

    const selected =
      document.querySelector('.option.selected, .answer.selected, .choice.selected, .option-btn.selected, button[data-option].selected');

    const fb = document.getElementById('answer-feedback');
    if (!selected) {
      if (fb) fb.textContent = '⚠️ Escolha uma alternativa antes de confirmar.';
      return;
    }

    confirmed = true;

    // Try to determine the selected index from common attributes/classes.
    let selectedIndex = selected.dataset.index;
    if (selectedIndex == null) selectedIndex = selected.dataset.optionIndex;

    // If the original app exposes a current question object, use its answer field.
    let correctIndex = null;
    const q = window.qs && window.qs[window.currentQuestion ?? window.current ?? 0];
    if (q) correctIndex = q.answer ?? q.correct ?? q.correctIndex;

    if (selectedIndex != null && correctIndex != null) {
      const ok = Number(selectedIndex) === Number(correctIndex);
      if (fb) fb.textContent = ok ? '✅ Você acertou!' : '❌ Você errou. Tente novamente.';
    } else {
      // Fallback: preserve the page's existing answer-checking function if available.
      if (typeof window.checkAnswer === 'function') {
        try { window.checkAnswer(selected); } catch (_) {}
      } else if (fb) {
        fb.textContent = '✅ Resposta confirmada!';
      }
    }

    const btn = document.getElementById('confirm-btn');
    if (btn) {
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.style.cursor = 'default';
    }
  };

  // Reset confirmation whenever a new question is rendered.
  const originalRender = window.renderQuestion;
  if (typeof originalRender === 'function') {
    window.renderQuestion = function () {
      confirmed = false;
      window.selectedAnswer = null;
      const fb = document.getElementById('answer-feedback');
      const btn = document.getElementById('confirm-btn');
      if (fb) fb.textContent = '';
      if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
      return originalRender.apply(this, arguments);
    };
  }
})();
</script>

</body>
</html>
