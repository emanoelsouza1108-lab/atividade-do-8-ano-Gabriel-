<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atividade do 8º Ano</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#1d4ed8,#0f172a);
  color:#fff
}
.wrap{max-width:850px;margin:auto;padding:20px}
.card{
  background:rgba(255,255,255,.95);color:#172033;border-radius:22px;
  padding:24px;box-shadow:0 12px 35px #0006;margin:18px 0
}
h1{margin-top:0;color:#173b8f}
.intro{line-height:1.65}
.q{font-size:20px;font-weight:700;margin:0 0 18px}
.opt{
  display:block;width:100%;margin:10px 0;padding:14px;
  border:2px solid #cbd5e1;border-radius:14px;background:#fff;
  text-align:left;font-size:16px;cursor:pointer
}
.opt:hover{background:#eff6ff}
.opt.sel{border-color:#2563eb;background:#dbeafe}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{background:#dbeafe;color:#1e40af;border-radius:999px;padding:8px 12px;font-weight:700}
.next,.restart{
  border:0;border-radius:14px;padding:14px 20px;font-size:16px;
  font-weight:700;background:#2563eb;color:#fff;cursor:pointer
}
.next:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none}
.score{font-size:30px;font-weight:800;color:#173b8f}
.small{color:#475569}
hr{border:0;border-top:1px solid #cbd5e1;margin:22px 0}
</style>
</head>
<body>
<div class="wrap">

<section id="start" class="card">
<h1>📚 Atividade do 8º Ano</h1>
<p>40 questões: 20 de Português e 20 de Matemática.</p>
<p class="small">
Escolha uma alternativa. Você não verá se acertou ou errou durante a atividade.
A pontuação aparece somente no final.
</p>
<button class="next" onclick="begin()">🚀 Entrar na atividade</button>
</section>

<section id="quiz" class="card hidden">
<div class="top">
<span class="pill" id="part"></span>
<span class="pill" id="count"></span>
</div>
<div id="questionBox"></div>
<div style="display:flex;gap:10px;margin-top:12px"><button class="next" id="back" onclick="goBack()" disabled style="flex:1">⬅️ Voltar</button><button class="next" id="next" disabled onclick="goNext()" style="flex:2">Próxima questão</button></div>
</section>

<section id="result" class="card hidden"></section>

</div>

<script>
const textBase = `Em uma escola, um grupo de estudantes decidiu transformar uma sala pouco utilizada em um espaço de estudos. Eles organizaram os livros por assunto, criaram um mural com metas semanais e combinaram horários para estudar em silêncio. No começo, alguns alunos acharam difícil manter a rotina. Com o passar das semanas, perceberam que pequenas atitudes faziam diferença: separar o material antes de começar, dividir tarefas maiores em etapas e reservar alguns minutos para revisar o que havia sido aprendido.

A turma também descobriu que estudar não significa apenas memorizar informações. Fazer perguntas, comparar ideias, explicar um conteúdo com as próprias palavras e corrigir os próprios erros ajudam a construir uma aprendizagem mais sólida. Assim, o espaço de estudos passou a ser usado não apenas antes das provas, mas durante todo o processo de aprendizagem.`;

const qs = [
["Português","1. A ideia central do texto permite concluir que a organização dos estudos é apresentada como:",["uma condição suficiente para aprender, independentemente de outros fatores.","um recurso que, combinado a revisão e participação ativa, pode favorecer a aprendizagem.","uma estratégia útil principalmente para alunos que têm dificuldade de memorizar.","um método destinado a substituir a compreensão pelo hábito."],1],
["Português","2. Quando o texto afirma que “pequenas atitudes faziam diferença”, o sentido mais adequado é:",["ações aparentemente simples podem produzir efeitos relevantes quando incorporadas à rotina.","qualquer atitude pequena produz obrigatoriamente um grande resultado.","somente atitudes individuais conseguem modificar uma rotina de estudos.","ações simples são mais importantes do que compreender o conteúdo."],0],
["Português","3. A expressão “No começo” estabelece, no desenvolvimento do texto, uma relação principalmente de:",["causa, porque explica por que os alunos estudavam em silêncio.","tempo, porque situa uma dificuldade em uma etapa inicial do processo.","oposição, porque contradiz diretamente a organização dos livros.","finalidade, porque indica o objetivo da criação da sala."],1],
["Português","4. Em “Com o passar das semanas, perceberam...”, o sujeito oculto de “perceberam” pode ser identificado pelo contexto como:",["os livros.","as semanas.","os estudantes.","as metas semanais."],2],
["Português","5. A mudança entre o início e o final do texto pode ser resumida corretamente como:",["da dificuldade de manter uma rotina para uma compreensão mais ampla de como aprender.","da memorização eficiente para o abandono completo das provas.","da organização dos livros para a conclusão de que revisar é desnecessário.","do estudo silencioso para a preferência por atividades exclusivamente coletivas."],0],
["Português","6. No trecho “não significa apenas memorizar informações”, a palavra “apenas” contribui para:",["restringir o sentido de estudar exclusivamente à memorização.","mostrar que memorizar é a única atividade considerada importante.","indicar que a memorização faz parte do estudo, mas não o esgota.","negar que memorizar possa ter qualquer utilidade."],2],
["Português","7. Em “Fazer perguntas, comparar ideias, explicar um conteúdo... ajudam”, o verbo “ajudam” está no plural porque:",["concorda apenas com “conteúdo”.","concorda com o conjunto de ações apresentado como sujeito composto.","concorda com “informações”, palavra mais próxima.","foi empregado no plural por causa de “próprias”."],1],
["Português","8. Se o trecho “durante todo o processo de aprendizagem” fosse substituído por “somente na véspera das provas”, haveria principalmente uma mudança de:",["tempo e frequência da utilização do espaço.","sujeito e predicado da oração.","causa e consequência do projeto.","sentido de “aprender” para “memorizar”."],0],
["Português","9. Qual alternativa apresenta uma inferência que o texto permite fazer, embora não a declare exatamente dessa forma?",["Os estudantes nunca tiveram dificuldades com a rotina.","A sala passou a ser usada de maneira mais contínua ao longo da aprendizagem.","Todos os alunos passaram a estudar exatamente da mesma maneira.","A escola transformou todas as salas em espaços de estudo."],1],
["Português","10. A palavra “Assim”, no último período, introduz uma ideia de:",["conclusão ou consequência em relação ao que foi apresentado anteriormente.","oposição entre os estudantes e a escola.","dúvida sobre a utilização do espaço.","explicação de uma informação anterior."],0],
["Português","11. Em “separar o material antes de começar”, a palavra “antes” estabelece uma relação de:",["modo.","tempo.","condição.","concessão."],1],
["Português","12. Em “reservar alguns minutos para revisar”, a expressão “para revisar” indica:",["causa da reserva dos minutos.","finalidade da reserva dos minutos.","oposição à reserva dos minutos.","consequência da revisão."],1],
["Português","13. Qual reescrita mantém o sentido essencial de “estudar não significa apenas memorizar informações”?",["Estudar equivale exclusivamente a memorizar informações.","Estudar envolve mais do que simplesmente memorizar informações.","Estudar impede que informações sejam memorizadas.","Estudar torna a memorização desnecessária em qualquer situação."],1],
["Português","14. Em “uma sala pouco utilizada”, a palavra “utilizada” exerce função de:",["substantivo que nomeia a sala.","adjetivo que caracteriza a sala.","verbo principal de uma oração independente.","advérbio que modifica “pouco”."],1],
["Português","15. Em “os próprios erros”, a palavra “próprios” serve principalmente para:",["intensificar a ideia de que os erros pertencem aos próprios estudantes.","indicar que os erros pertencem a outra pessoa.","transformar “erros” em verbo.","indicar quantidade exata de erros."],0],
["Português","16. No trecho “dividir tarefas maiores em etapas”, a palavra “maiores” estabelece uma característica em relação a:",["tarefas.","etapas.","dividir.","em."],0],
["Português","17. A construção “não apenas antes das provas, mas durante todo o processo” produz o efeito de:",["limitar o uso do espaço ao período de avaliações.","ampliar a ideia de quando o espaço passou a ser utilizado.","apresentar duas situações necessariamente contraditórias.","mostrar que as provas deixaram de existir."],1],
["Português","18. Se “a turma também descobriu” fosse transformado em “a turma também havia descoberto”, a principal alteração seria:",["mudança no tempo verbal, sem alterar essencialmente o sujeito.","mudança do sujeito para “a turma também”.","mudança de voz ativa para voz passiva.","mudança da frase para o modo imperativo."],0],
["Português","19. Qual alternativa apresenta uma afirmação incompatível com o texto?",["A revisão aparece como parte do processo de aprendizagem.","Explicar conteúdos com as próprias palavras é apresentado como algo útil.","A turma percebeu que aprender pode envolver mais do que memorizar.","O espaço de estudos foi planejado para ser usado exclusivamente antes das provas."],3],
["Português","20. Qual título exige MENOS informações que não aparecem no texto e melhor preserva sua ideia central?",["A sala que transformou todos os estudantes em gênios","Como pequenas práticas podem favorecer uma aprendizagem mais consistente","A competição que decidiu quem estudava melhor","O método definitivo para nunca mais errar em uma prova"],1],
["Matemática","21. Se 3(2x − 4) − 2(x + 5) = 18, qual é o valor de x?",["5","6","7","8"],2],
["Matemática","22. Um número aumentado de 20% resulta em 72. Qual era o número original?",["54","57,6","60","62"],2],
["Matemática","23. Qual expressão é equivalente a 5/6 − 1/4?",["7/12","9/24","4/12","1/2"],0],
["Matemática","24. Um produto custa R$ 200. Primeiro recebe 15% de desconto e depois, sobre o novo preço, recebe mais 10% de desconto. O preço final é:",["R$ 150","R$ 153","R$ 155","R$ 170"],1],
["Matemática","25. Uma turma tem 32 alunos. 3/8 deles faltaram. Quantos alunos compareceram?",["12","20","24","28"],1],
["Matemática","26. Resolva: 5x − 2 = 3x + 14.",["6","7","8","9"],2],
["Matemática","27. Um retângulo tem perímetro 50 cm. Seu comprimento mede 3 cm a mais que sua largura. Qual é a área?",["144 cm²","150 cm²","154 cm²","160 cm²"],2],
["Matemática","28. Um quadrado possui área de 196 cm². Se seu lado aumentar 2 cm, qual será a nova área?",["210 cm²","216 cm²","224 cm²","225 cm²"],3],
["Matemática","29. Qual dos números é o maior?",["0,61","3/5","61/100","0,605"],0],
["Matemática","30. Uma conta bancária estava em −R$ 35. Foi depositado R$ 80 e depois retirado R$ 27. Qual foi o saldo final?",["R$ 18","R$ 28","R$ 38","R$ 42"],1],
["Matemática","31. Se f(x) = 2x² − 3, qual é f(−2)?",["−11","5","8","11"],3],
["Matemática","32. Qual é o resultado de (−2)³ + 5² − 6?",["−15","3","11","27"],1],
["Matemática","33. Uma loja aumenta um preço de R$ 240 em 12,5%. O novo preço é:",["R$ 260","R$ 265","R$ 270","R$ 275"],2],
["Matemática","34. “A metade da diferença entre x e 6” pode ser representada por:",["x/2 − 6","(x − 6)/2","x − 6/2","(x + 6)/2"],1],
["Matemática","35. Dois ângulos são suplementares. Um mede 4x + 10° e o outro 2x − 10°. Qual é x?",["25","30","35","40"],1],
["Matemática","36. Em um triângulo, os ângulos medem x, 2x + 10° e 3x − 10°. O maior ângulo mede:",["70°","80°","90°","100°"],2],
["Matemática","37. Um cubo tem volume de 343 cm³. Qual é a medida de sua aresta?",["6 cm","7 cm","8 cm","9 cm"],1],
["Matemática","38. Uma quantia de R$ 360 é dividida na razão 2:3:4 entre três pessoas. Quanto recebe a pessoa que fica com a maior parte?",["R$ 120","R$ 140","R$ 160","R$ 180"],2],
["Matemática","39. Em uma prova, um aluno acertou 72% de 50 questões. Quantas ele errou?",["12","14","16","18"],1],
["Matemática","40. Um número é multiplicado por 4, depois diminuído de 9, e o resultado é igual ao dobro desse número mais 7. Qual é o número?",["6","7","8","9"],2]
];


let i=0, score=0, chosen=null;
const answers=[];

function begin(){
  i=0; score=0; chosen=null; answers.length=0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}

function render(){
  chosen = answers[i] ?? null;
  const q=qs[i];
  document.getElementById('part').textContent=q[0];
  document.getElementById('count').textContent=(i+1)+' / 40';

  const box=document.getElementById('questionBox');
  box.innerHTML='';

  if(i===0){
    const p=document.createElement('div');
    p.className='intro';
    p.innerHTML='<h2>Texto-base</h2>'+
      '<p>'+textBase.replace(/\n\n/g,'</p><p>')+'</p><hr>';
    box.appendChild(p);
  }

  const h=document.createElement('p');
  h.className='q';
  h.textContent=q[1];
  box.appendChild(h);

  q[2].forEach((a,n)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=a;
    if(chosen===n) b.classList.add('sel');
    b.onclick=()=>choose(b,n);
    if(chosen!==null) b.disabled=true;
    box.appendChild(b);
  });

  document.getElementById('back').disabled = i===0;
  const next=document.getElementById('next');
  next.disabled=chosen===null;
  next.textContent=i===39?'Ver resultado':'Próxima questão';
}

function choose(btn,n){
  if(chosen!==null)return;
  chosen=n;
  answers[i]=n;
  btn.classList.add('sel');
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  document.getElementById('next').disabled=false;
}

function goNext(){
  if(chosen===null)return;
  i++;
  if(i<qs.length) render();
  else finish();
}

function goBack(){
  if(i===0)return;
  i--;
  render();
}

function finish(){
  document.getElementById('quiz').classList.add('hidden');
  const r=document.getElementById('result');
  r.classList.remove('hidden');

  score=answers.reduce((total,ans,n)=>total+(ans===qs[n][3]?1:0),0);
  const ok=score>=20;
  r.innerHTML=
    '<h1>🏁 Resultado</h1>'+
    '<p class="score">'+score+' / 40 pontos</p>'+
    '<h2>'+(ok?'🎉 Meta atingida!':'📖 Meta não atingida')+'</h2>'+
    '<p>'+(ok
      ?'Você alcançou pelo menos 20 pontos.'
      :'Você ficou abaixo de 20 pontos. Revise o conteúdo e tente novamente.')+
    '</p>'+
    '<button class="restart" onclick="restart()">🔄 Recomeçar</button>';
}

function restart(){
  i=0;
  score=0;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}
</script>
</body>
</html>
